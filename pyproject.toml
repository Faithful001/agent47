[tool.poetry]
name = "agent47"
version = "0.1.0"
description = "Agent 47: A lethal multi-agent system for autonomous bug fixing and code refactoring in isolated environments."
authors = ["Faithful King <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115.0"
uvicorn = ">=0.32.0"
pydantic = ">=2.10.0"
sqlalchemy = ">=2.0.0"
psycopg2-binary = ">=2.9.9"
celery = "^5.4.0"
redis = "^5.0.0"
python-dotenv = ">=1.0.0"
docker = "^7.1.0"
gitpython = "^3.1.40"
pygithub = "^2.4.0"
pyjwt = "^2.9.0"
cryptography = "^43.0.0"
requests = "^2.32.0"
httpx = "^0.28.0"
websockets = "^14.0"
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langchain-core = "^0.3.0"
langchain-google-genai = "^2.0.0"
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.2.0"
langchain-huggingface = "^0.1.0"
langgraph = "^0.2.0"
langgraph-checkpoint = "^2.0.0"
langgraph-prebuilt = "^0.1.0"
langgraph-sdk = "^0.1.0"
langsmith = "^0.1.0"
deepagents = "^0.4.0"
huggingface-hub = "^0.26.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
